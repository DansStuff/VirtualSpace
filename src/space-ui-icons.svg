<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" stroke="#E8F1FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <title>Space Simulator UI Icons</title>
  <desc>16 useful HUD icons in a 4x4 grid for a space simulator game</desc>

  <!-- Soft panel background -->
  <rect x="0" y="0" width="512" height="512" fill="#0B1220" stroke="none"/>

  <!-- Grid guides (subtle) -->
  <g stroke="#1A2740" stroke-width="1" opacity="0.9">
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
  </g>

  <!-- ===================== ROW 1 ===================== -->

  <!-- 1. Thrusters / Engine -->
  <g transform="translate(64,64)" id="icon-thrusters">
    <path d="M0,-28 L14,-8 L14,18 L0,28 L-14,18 L-14,-8 Z"/>
    <path d="M-10,28 L-6,40 L0,32 L6,40 L10,28"/>
    <path d="M-6,18 L-6,8 M6,18 L6,8" opacity="0.7"/>
  </g>

  <!-- 2. Navigation / Compass -->
  <g transform="translate(192,64)" id="icon-navigation">
    <circle cx="0" cy="0" r="30"/>
    <path d="M0,-22 L8,6 L0,2 L-8,6 Z" fill="#E8F1FF" stroke="none"/>
    <path d="M0,22 L-6,-4 L0,0 L6,-4 Z" fill="#5B7C99" stroke="none"/>
    <circle cx="0" cy="0" r="3" fill="#0B1220" stroke="#E8F1FF"/>
  </g>

  <!-- 3. Radar / Scanner -->
  <g transform="translate(320,64)" id="icon-radar">
    <circle cx="0" cy="0" r="30"/>
    <circle cx="0" cy="0" r="18" opacity="0.55"/>
    <circle cx="0" cy="0" r="8" opacity="0.4"/>
    <path d="M0,0 L22,-18"/>
    <circle cx="14" cy="-10" r="3" fill="#7CF0FF" stroke="none"/>
    <path d="M0,-30 L0,30 M-30,0 L30,0" opacity="0.35" stroke-width="1.5"/>
  </g>

  <!-- 4. Shields -->
  <g transform="translate(448,64)" id="icon-shields">
    <path d="M0,-32 C14,-28 26,-22 28,-10 C28,8 14,24 0,34 C-14,24 -28,8 -28,-10 C-26,-22 -14,-28 0,-32 Z"/>
    <path d="M0,-18 C8,-16 14,-12 15,-4 C15,6 8,16 0,22 C-8,16 -15,6 -15,-4 C-14,-12 -8,-16 0,-18 Z" opacity="0.55"/>
  </g>

  <!-- ===================== ROW 2 ===================== -->

  <!-- 5. Fuel / Propellant -->
  <g transform="translate(64,192)" id="icon-fuel">
    <rect x="-16" y="-28" width="28" height="48" rx="4"/>
    <rect x="-10" y="-18" width="16" height="28" rx="2" fill="#3DDC97" stroke="none" opacity="0.85"/>
    <path d="M12,-10 L22,-10 L22,10 L16,16" />
    <path d="M-8,-34 L8,-34" stroke-width="3"/>
  </g>

  <!-- 6. Warp / Hyperspace -->
  <g transform="translate(192,192)" id="icon-warp">
    <circle cx="0" cy="0" r="10"/>
    <path d="M-28,-18 L-14,-8 M-30,0 L-14,0 M-28,18 L-14,8"/>
    <path d="M28,-18 L14,-8 M30,0 L14,0 M28,18 L14,8"/>
    <path d="M-8,-28 L0,-16 M8,-28 L0,-16" opacity="0.6"/>
    <path d="M-8,28 L0,16 M8,28 L0,16" opacity="0.6"/>
  </g>

  <!-- 7. Target Lock -->
  <g transform="translate(320,192)" id="icon-target">
    <circle cx="0" cy="0" r="22"/>
    <circle cx="0" cy="0" r="8"/>
    <path d="M0,-32 L0,-22 M0,22 L0,32 M-32,0 L-22,0 M22,0 L32,0"/>
    <path d="M-28,-28 L-18,-28 L-18,-18 M28,-28 L18,-28 L18,-18 M-28,28 L-18,28 L-18,18 M28,28 L18,28 L18,18"/>
  </g>

  <!-- 8. Planet / Destination -->
  <g transform="translate(448,192)" id="icon-planet">
    <circle cx="0" cy="0" r="28"/>
    <ellipse cx="0" cy="0" rx="12" ry="28"/>
    <path d="M-26,-8 C-10,-14 10,-14 26,-8" opacity="0.7"/>
    <path d="M-24,10 C-8,16 10,14 24,8" opacity="0.55"/>
    <ellipse cx="0" cy="4" rx="34" ry="8" transform="rotate(-20)" opacity="0.85"/>
  </g>

  <!-- ===================== ROW 3 ===================== -->

  <!-- 9. Communications -->
  <g transform="translate(64,320)" id="icon-comms">
    <path d="M0,18 L0,-8"/>
    <circle cx="0" cy="24" r="6"/>
    <path d="M-12,-4 A14,14 0 0,1 12,-4"/>
    <path d="M-20,-14 A24,24 0 0,1 20,-14" opacity="0.75"/>
    <path d="M-28,-24 A34,34 0 0,1 28,-24" opacity="0.5"/>
  </g>

  <!-- 10. Hull Integrity / Ship -->
  <g transform="translate(192,320)" id="icon-hull">
    <path d="M0,-30 L22,-10 L16,26 L0,20 L-16,26 L-22,-10 Z"/>
    <path d="M-8,-4 L8,-4 M0,-18 L0,8" opacity="0.65"/>
    <path d="M-14,14 L14,14" opacity="0.45"/>
  </g>

  <!-- 11. Life Support / Oxygen -->
  <g transform="translate(320,320)" id="icon-oxygen">
    <circle cx="-10" cy="-4" r="14"/>
    <circle cx="12" cy="2" r="18"/>
    <circle cx="-2" cy="16" r="10"/>
    <path d="M-22,-18 L-28,-28 M22,-14 L30,-24" opacity="0.5"/>
  </g>

  <!-- 12. Star Map / Galaxy -->
  <g transform="translate(448,320)" id="icon-starmap">
    <ellipse cx="0" cy="0" rx="30" ry="12" transform="rotate(-25)"/>
    <ellipse cx="0" cy="0" rx="30" ry="12" transform="rotate(35)" opacity="0.7"/>
    <circle cx="0" cy="0" r="5" fill="#E8F1FF" stroke="none"/>
    <circle cx="-18" cy="-10" r="2" fill="#E8F1FF" stroke="none"/>
    <circle cx="20" cy="8" r="1.5" fill="#E8F1FF" stroke="none"/>
    <circle cx="10" cy="-16" r="1.5" fill="#E8F1FF" stroke="none"/>
    <circle cx="-8" cy="14" r="1.2" fill="#E8F1FF" stroke="none"/>
  </g>

  <!-- ===================== ROW 4 ===================== -->

  <!-- 13. Alert / Warning -->
  <g transform="translate(64,448)" id="icon-alert">
    <path d="M0,-30 L28,26 L-28,26 Z"/>
    <path d="M0,-10 L0,8" stroke-width="3"/>
    <circle cx="0" cy="18" r="2.5" fill="#E8F1FF" stroke="none"/>
  </g>

  <!-- 14. Docking Port -->
  <g transform="translate(192,448)" id="icon-dock">
    <rect x="-28" y="-20" width="16" height="40" rx="2"/>
    <rect x="12" y="-20" width="16" height="40" rx="2"/>
    <path d="M-8,0 L8,0" stroke-width="3"/>
    <path d="M-4,-10 L4,-10 M-4,10 L4,10" opacity="0.6"/>
    <circle cx="0" cy="0" r="4"/>
  </g>

  <!-- 15. Cargo / Inventory -->
  <g transform="translate(320,448)" id="icon-cargo">
    <path d="M-24,-8 L0,-22 L24,-8 L24,18 L0,32 L-24,18 Z"/>
    <path d="M-24,-8 L0,6 L24,-8"/>
    <path d="M0,6 L0,32"/>
    <path d="M-10,-2 L-10,12 L10,12 L10,-2" opacity="0.55"/>
  </g>

  <!-- 16. Power / Systems -->
  <g transform="translate(448,448)" id="icon-power">
    <circle cx="0" cy="0" r="30"/>
    <path d="M4,-18 L-8,2 L2,2 L-4,18 L8,-2 L-2,-2 Z" fill="#F5D76E" stroke="#F5D76E"/>
  </g>
</svg>
