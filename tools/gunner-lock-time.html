<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Skill progression</title>
  <style>
    :root {
      --bg: #12141a;
      --panel: #1a1d26;
      --line: #2a2f3a;
      --text: #e8eaef;
      --muted: #8b93a4;
      --band: #3dd68c;
      --reach: #6d5cff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 15px/1.45 "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    main {
      max-width: 920px;
      margin: 0 auto;
      padding: 28px 20px 48px;
    }
    h1 { font-size: 1.35rem; font-weight: 650; margin: 0 0 6px; }
    .sub { color: var(--muted); margin: 0 0 16px; }
    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
    }
    .tabs button {
      background: var(--panel);
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 14px;
      font: inherit;
      cursor: pointer;
    }
    .tabs button.active {
      color: var(--text);
      border-color: var(--reach);
      background: #242038;
    }
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 18px;
    }
    label { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .row { display: flex; gap: 8px; align-items: center; }
    input[type="number"] {
      width: 110px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      font: inherit;
    }
    input[type="range"] { flex: 1; }
    .fixed {
      display: flex;
      gap: 18px;
      color: var(--muted);
      font-size: 13px;
      margin: -8px 0 16px;
    }
    canvas {
      width: 100%;
      height: 220px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
    }
    .legend { display: flex; gap: 16px; margin: 8px 0 18px; font-size: 13px; color: var(--muted); }
    .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; }
    table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 12px; overflow: hidden; }
    th, td { text-align: right; padding: 8px 12px; border-bottom: 1px solid var(--line); }
    th:first-child, td:first-child { text-align: left; }
    th { font-size: 12px; color: var(--muted); font-weight: 600; }
    .total td { border-bottom: none; font-weight: 650; }
    @media (max-width: 640px) { .controls { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Gunner lock time</h1>
    <p class="sub" id="subtitle"></p>
    <div class="tabs">
      <button type="button" id="tab-gunner" class="active">Gunner</button>
      <button type="button" id="tab-engineering">Engineering</button>
    </div>
    <div class="controls">
      <label>
        Level 1 XP
        <span class="row">
          <input id="base" type="number" min="5" step="5" />
          <input id="baseRange" type="range" min="50" max="800" step="5" />
        </span>
      </label>
      <label>
        Growth multiplier
        <span class="row">
          <input id="growth" type="number" min="1" max="3" step="0.05" />
          <input id="growthRange" type="range" min="1" max="2.5" step="0.05" />
        </span>
      </label>
    </div>
    <div class="fixed" id="fixed"></div>
    <canvas id="chart" width="880" height="220"></canvas>
    <div class="legend">
      <span><span class="swatch" style="background: var(--band)"></span><span id="legend-band">Band (this level)</span></span>
      <span><span class="swatch" style="background: var(--reach)"></span><span id="legend-reach">Time to reach</span></span>
    </div>
    <table>
      <thead>
        <tr>
          <th>Reach</th>
          <th>XP this band</th>
          <th id="col-band">Band lock</th>
          <th id="col-reach">Time to reach</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </main>
  <script>
    const MAX_LEVEL = 10
    const skills = {
      gunner: {
        name: 'Gunner',
        base: 200,
        growth: 2,
        xpPer: 5,
        kind: 'time',
        interval: 0.5,
        title: 'Gunner lock time',
        subtitle: 'Same formula as the scene: round(level1Xp × growth^(level − 1)), 5 XP every 0.5s of lock.',
        fixed: '5 XP / tick · 0.5s interval · max level 10',
        legendBand: 'Band lock',
        legendReach: 'Time to reach',
        colBand: 'Band lock',
        colReach: 'Time to reach'
      },
      engineering: {
        name: 'Engineering',
        base: 160,
        growth: 1.2,
        xpPer: 40,
        kind: 'repairs',
        title: 'Engineering repairs',
        subtitle: 'Same formula as the scene: round(level1Xp × growth^(level − 1)), 40 XP per repair.',
        fixed: '40 XP / repair · max level 10',
        legendBand: 'Band repairs',
        legendReach: 'Repairs to reach',
        colBand: 'Band repairs',
        colReach: 'Repairs to reach'
      }
    }

    let skillId = 'gunner'

    const baseEl = document.getElementById('base')
    const baseRange = document.getElementById('baseRange')
    const growthEl = document.getElementById('growth')
    const growthRange = document.getElementById('growthRange')
    const rowsEl = document.getElementById('rows')
    const canvas = document.getElementById('chart')
    const ctx = canvas.getContext('2d')

    function xpToNext(level, base, growth) {
      return Math.round(base * Math.pow(growth, level - 1))
    }

    function formatTime(seconds) {
      const m = Math.floor(seconds / 60)
      const s = seconds - m * 60
      if (m <= 0) return s.toFixed(1) + 's'
      return m + ':' + s.toFixed(1).padStart(4, '0')
    }

    function compute(skill, base, growth) {
      const bands = []
      let level = 1
      let xp = 0
      let grants = 0
      let bandStart = 0
      while (level < MAX_LEVEL) {
        const need = xpToNext(level, base, growth)
        xp += skill.xpPer
        grants += 1
        if (xp >= need) {
          xp -= need
          const bandGrants = grants - bandStart
          bands.push({
            to: level + 1,
            need,
            bandGrants,
            reachGrants: grants,
            bandValue: skill.kind === 'time' ? bandGrants * skill.interval : bandGrants,
            reachValue: skill.kind === 'time' ? grants * skill.interval : grants
          })
          level += 1
          bandStart = grants
          if (level >= MAX_LEVEL) break
        }
      }
      return bands
    }

    function formatValue(skill, value) {
      return skill.kind === 'time' ? formatTime(value) : String(value)
    }

    function draw(bands) {
      const w = canvas.width
      const h = canvas.height
      ctx.clearRect(0, 0, w, h)
      if (!bands.length) return
      const max = bands[bands.length - 1].reachValue
      const pad = { l: 44, r: 16, t: 16, b: 36 }
      const innerW = w - pad.l - pad.r
      const innerH = h - pad.t - pad.b
      const barW = innerW / bands.length
      ctx.strokeStyle = '#2a2f3a'
      ctx.lineWidth = 1
      ctx.beginPath()
      ctx.moveTo(pad.l, pad.t)
      ctx.lineTo(pad.l, h - pad.b)
      ctx.lineTo(w - pad.r, h - pad.b)
      ctx.stroke()
      bands.forEach((band, i) => {
        const x = pad.l + i * barW
        const reachH = (band.reachValue / max) * innerH
        const bandH = (band.bandValue / max) * innerH
        ctx.fillStyle = 'rgba(109, 92, 255, 0.28)'
        ctx.fillRect(x + 8, h - pad.b - reachH, barW - 16, reachH)
        ctx.fillStyle = '#3dd68c'
        ctx.fillRect(x + 8, h - pad.b - bandH, barW - 16, bandH)
        ctx.fillStyle = '#8b93a4'
        ctx.font = '12px Segoe UI, sans-serif'
        ctx.textAlign = 'center'
        ctx.fillText('L' + band.to, x + barW / 2, h - 12)
      })
    }

    function applySkillUi(skill) {
      document.getElementById('title').textContent = skill.title
      document.getElementById('subtitle').textContent = skill.subtitle
      document.getElementById('fixed').textContent = skill.fixed
      document.getElementById('legend-band').textContent = skill.legendBand
      document.getElementById('legend-reach').textContent = skill.legendReach
      document.getElementById('col-band').textContent = skill.colBand
      document.getElementById('col-reach').textContent = skill.colReach
      document.getElementById('tab-gunner').classList.toggle('active', skillId === 'gunner')
      document.getElementById('tab-engineering').classList.toggle('active', skillId === 'engineering')
      baseEl.value = skill.base
      baseRange.value = skill.base
      growthEl.value = skill.growth
      growthRange.value = skill.growth
    }

    function render() {
      const skill = skills[skillId]
      skill.base = Math.max(1, Number(baseEl.value) || 0)
      skill.growth = Math.max(1, Number(growthEl.value) || 1)
      const bands = compute(skill, skill.base, skill.growth)
      const last = bands[bands.length - 1]
      rowsEl.innerHTML = bands.map((band) => `
        <tr>
          <td>Level ${band.to}</td>
          <td>${band.need}</td>
          <td>${formatValue(skill, band.bandValue)}</td>
          <td>${formatValue(skill, band.reachValue)}</td>
        </tr>
      `).join('') + (last ? `
        <tr class="total">
          <td>Level ${MAX_LEVEL} total</td>
          <td>${bands.reduce((sum, band) => sum + band.need, 0)}</td>
          <td></td>
          <td>${formatValue(skill, last.reachValue)}</td>
        </tr>
      ` : '')
      draw(bands)
    }

    function bind(input, range) {
      input.addEventListener('input', () => {
        range.value = input.value
        render()
      })
      range.addEventListener('input', () => {
        input.value = range.value
        render()
      })
    }

    function setSkill(next) {
      skillId = next
      applySkillUi(skills[skillId])
      render()
    }

    document.getElementById('tab-gunner').addEventListener('click', () => setSkill('gunner'))
    document.getElementById('tab-engineering').addEventListener('click', () => setSkill('engineering'))
    bind(baseEl, baseRange)
    bind(growthEl, growthRange)
    applySkillUi(skills.gunner)
    render()
  </script>
</body>
</html>
